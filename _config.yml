title: 夜樱手帐
subtitle: Sakura Journal
description: 阿海的博客，拼凑折腾与日常的碎片
author: 阿海
language: zh-CN
timezone: 'Asia/Shanghai'
url: https://rhsy.moe
root: /
permalink: :year/:month/:day/:title/
theme: pinkblog
post_asset_folder: true

feed:
  type: atom
  path: atom.xml
  limit: 20

sitemap:
  path: sitemap.xml

index_generator:
  path: ''
  per_page: 6

marked:
  gfm: true
  postAsset: true

# 代码高亮：hljs 类名 + 无行号（行号的 gutter 表格布局会把行号与代码分家）
syntax_highlighter: highlight.js
highlight:
  line_number: false
  hljs: true
  tab_replace: '  '

# Hexo 默认忽略 _ 开头的文件；_headers 是 Cloudflare 静态资源的自定义响应头配置
include:
  - _headers

server:
  port: 4000
  compress: true

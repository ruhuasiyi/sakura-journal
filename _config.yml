title: 夜樱手帐
subtitle: Sakura Journal
description: RHSY 的手帐博客 · 夜樱与樱花的手帐
author: RHSY
language: zh-CN
timezone: 'Asia/Shanghai'
url: http://localhost:4000
root: /
permalink: :year/:month/:day/:title/
theme: pinkblog
post_asset_folder: true

index_generator:
  path: ''
  per_page: 6

marked:
  gfm: true
  postAsset: true

# 代码高亮：hljs 类名 + 无行号（行号的 gutter 表格布局会把行号与代码分家）
syntax_highlighter: highlight.js
highlight:
  line_number: false
  hljs: true
  tab_replace: '  '

# Hexo 默认忽略 _ 开头的文件；_headers 是 Cloudflare 静态资源的自定义响应头配置
include:
  - _headers

server:
  port: 4000
  compress: true
